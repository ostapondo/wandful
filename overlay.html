<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wandful Overlay</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; cursor: none; user-select: none; -webkit-user-select: none; }
      #veil { position: fixed; inset: 0; background: rgba(6, 4, 14, 0.9); opacity: 0; transition: opacity .18s ease-out; pointer-events: none; }
      body.on #veil { opacity: 1; }
      canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
      #hint { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: rgba(236,231,250,.55); letter-spacing: .2px; pointer-events: none; opacity: 0; transition: opacity .3s; }
      body.on #hint { opacity: 1; }
      #close { position: fixed; top: 44px; right: 24px; z-index: 5; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); background: rgba(20,14,40,.85); color: rgba(236,231,250,.9); padding: 0; display: flex; align-items: center; justify-content: center; cursor: none; opacity: 0; transition: opacity .3s, background .15s, transform .1s; pointer-events: none; -webkit-appearance: none; }
      #close svg { width: 14px; height: 14px; display: block; }
      body.on #close { opacity: 1; pointer-events: auto; }
      #close:hover { background: rgba(167,139,250,.35); border-color: rgba(167,139,250,.7); transform: scale(1.06); }
      #hint kbd { font: inherit; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: rgba(236,231,250,.8); }
    </style>
  </head>
  <body>
    <div id="veil"></div>
    <canvas id="c"></canvas>
    <button id="close" title="Close (Esc)"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
    <div id="hint">Hold a mouse button and draw a rune · click or press <kbd>Esc</kbd> to close</div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
