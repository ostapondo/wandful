name: Feature request
description: Something Wandful should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ROADMAP.md is worth a look first. It has what is being built now, and a
        "Not planned" section explaining what was considered and left out, which
        may already answer this.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation at your desk, not the feature. What you keep reaching
        for, how often, what gets in the way.
      placeholder: |
        I use the same rune for "new tab" in three browsers and "new file" in
        my editor, and want it to mean the right thing in each without four
        spells.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do about it today
      description: >
        Including anything in Wandful you tried that nearly worked. A feature
        that already exists under a different name is the most common outcome
        here.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it belongs
      description: Best guess is fine.
      options:
        - The spellbook window - a setting, a field, a page
        - The wand itself - how it draws, recognises, or casts
        - The tray / hotkey / how it is summoned
        - A new kind of spell action
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Does it need anything Wandful currently avoids
      description: >
        None of these is a refusal by itself, but each one is a promise
        README.md and SECURITY.md make that would have to be rewritten, so it
        is better said now than found later.
      options:
        - label: A network connection
        - label: A permission beyond Accessibility
        - label: A frontend framework or a large new dependency
        - label: None of these, as far as I can tell
  - type: checkboxes
    id: offer
    attributes:
      label: Optional
      options:
        - label: I would be up for building this if the approach is agreed first
