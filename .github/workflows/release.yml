name: Release

# Cutting a release is: bump the version in package.json, tauri.conf.json and
# Cargo.toml (CI checks they agree), move CHANGELOG's Unreleased under it,
# then `git tag v0.1.0 && git push --tags`. Everything after that happens
# here rather than on a laptop, and that is the point: every bundle leaves
# with a provenance attestation GitHub signs, so anyone can tie the file they
# downloaded back to the commit it was built from. The command to check it is
# in SECURITY.md.
#
# The release is created as a DRAFT. Nothing reaches users until someone has
# read the artefacts, written the notes, and pressed publish.
#
# Optional secrets, under Settings > Secrets and variables > Actions:
#
#   WANDFUL_SIGN_CERT_P12       a code-signing certificate and key, base64
#   WANDFUL_SIGN_CERT_PASSWORD  the password it was exported with
#
# Without them the macOS bundle is ad-hoc signed, which works but makes macOS
# forget the Accessibility grant on every update. scripts/make-signing-cert.sh
# makes a self-signed pair locally; export it from Keychain Access as .p12 and
# `base64 -i cert.p12 | pbcopy`. That key is not an Apple identity and proves
# nothing to Gatekeeper; what it does is keep the signature stable across
# versions so the permission carries over. Guard it anyway: whoever holds it
# can produce a bundle that inherits a user's existing grant.

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Deliberately without cancel-in-progress: two runs for the same tag should
# queue, and the second one finds the release already there.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version
        id: version
        run: |
          set -eu
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v in src-tauri/tauri.conf.json"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # Windows is on the roadmap: the code compiles there, but nobody has
          # run it on real hardware yet, so it is not shipped.
    runs-on: ${{ matrix.os }}
    env:
      # `secrets` cannot be read in a step's `if`; this can.
      HAS_SIGNING_CERT: ${{ secrets.WANDFUL_SIGN_CERT_P12 != '' }}
    permissions:
      contents: write # create the draft release, upload the bundles
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (stable)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Import the signing certificate (macOS, optional)
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        env:
          P12: ${{ secrets.WANDFUL_SIGN_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.WANDFUL_SIGN_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/wandful-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          P12_FILE="$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12" | base64 --decode > "$P12_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_FILE" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # A self-signed root: tell the system keychain to trust it, or
          # find-identity leaves it out and codesign refuses it.
          security find-certificate -c "Wandful Dev" -p "$KEYCHAIN" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046 # the existing keychain list is meant to split
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$P12_FILE" "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning | grep -q "Wandful Dev" \
            || { echo "::error::no valid codesigning identity named 'Wandful Dev' after import"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=Wandful Dev" >> "$GITHUB_ENV"

      # tauri-action runs `tauri build`, creates the release if it is not
      # there yet, and uploads the bundles for this target to it.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: Wandful ${{ needs.check.outputs.version }}
          releaseDraft: true
          prerelease: ${{ startsWith(needs.check.outputs.version, '0.') }}
          releaseBody: |
            Drafted by CI. Replace this with the release notes before publishing.

            Built from `${{ github.sha }}` by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Verify a download against that commit before installing:

            ```sh
            gh attestation verify <file> -R ${{ github.repository }}
            ```
          args: ${{ matrix.args }}

      # What ties each bundle to this repository, this commit and this run.
      # Without it the app's promises in SECURITY.md are only checkable at
      # runtime, on a binary nobody can trace back to the source.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
