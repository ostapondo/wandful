[package]
name = "wandful"
version = "0.0.1"
description = "Wandful — a pixel-art magic wand that casts keyboard shortcuts from mouse gestures"
authors = ["ostapondo"]
edition = "2021"
license = "MIT"
repository = "https://github.com/ostapondo/wandful"
homepage = "https://wandful.app"

[lib]
name = "wandful_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# vendored + patched: maps *MouseDragged events to MouseMove on macOS (upstream drops them)
rdev = { path = "vendor/rdev", features = ["unstable_grab"] }
enigo = "0.6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSDictionary", "NSArray", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
