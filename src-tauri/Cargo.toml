[package]
name = "wandful"
version = "0.1.0"
description = "Wandful — a pixel-art magic wand that casts keyboard shortcuts from mouse gestures"
authors = ["Ostap Belei"]
edition = "2021"

[lib]
name = "wandful_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# vendored + patched: maps *MouseDragged events to MouseMove on macOS (upstream drops them)
rdev = { path = "vendor/rdev", features = ["unstable_grab"] }
enigo = "0.6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
